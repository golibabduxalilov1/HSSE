version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tmk_hsse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - tmk_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tmk_hsse_redis
    ports:
      - "6379:6379"
    networks:
      - tmk_network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tmk_hsse_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tmk_network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tmk_hsse_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tmk_network
    restart: unless-stopped

  web:
    build: .
    container_name: tmk_hsse_web
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - kafka
    networks:
      - tmk_network
    restart: unless-stopped

  celery:
    build: .
    container_name: tmk_hsse_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - kafka
    networks:
      - tmk_network
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: tmk_hsse_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - tmk_network
    restart: unless-stopped

  kafka-consumer:
    build: .
    container_name: tmk_hsse_kafka_consumer
    command: python manage.py start_kafka_consumer
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - tmk_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tmk_hsse_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - tmk_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  tmk_network:
    driver: bridge
